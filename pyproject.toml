[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=62.4.0", "wheel" ]

[project]
authors = [ { email = "tony.dunsworth@gmail.com", name = "Tony Dunsworth" } ]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
description = "Frankie Programming Language parser"
keywords = [ "incremental", "parsing", "tree-sitter", "frankie" ]
license.text = "MIT"
name = "tree-sitter-frankie"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.urls]
Funding = ""
Homepage = "https://github.com/trdunsworth/frankie_tree_sitter"

[project.optional-dependencies]
core = [ "tree-sitter~=0.24" ]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
