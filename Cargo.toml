[package]
authors = [ "Tony Dunsworth <tony.dunsworth@gmail.com>" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Frankie Programming Language parser"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "frankie" ]
license = "MIT"
name = "tree-sitter-frankie"
readme = "README.md"
repository = "https://github.com/trdunsworth/frankie_tree_sitter"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
